# Local development Mosquitto config.
# No authentication — this broker is only ever exposed on the local Docker network
# for local dev / take-home-test purposes, not production use.

listener 1883
allow_anonymous true

# Enable MQTT-over-WebSockets on a separate listener, in case the frontend
# wants a direct browser subscription later (see architecture doc §F11 bonus).
listener 9001
protocol websockets
allow_anonymous true

persistence false
log_dest stdout
